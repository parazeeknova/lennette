name: API container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - apps/api/**
      - crates/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - infra/Dockerfile
      - .dockerignore
      - .github/workflows/api-image.yml
      - scripts/deploy-api.ts
      - scripts/deploy-api.test.ts
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Publish and deploy this branch for initial production setup
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publication so an older main build cannot overwrite latest later.
concurrency:
  group: api-image-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  checks:
    name: API lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: lennette
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: lennette
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lennette -d lennette"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://lennette:local-development-only@127.0.0.1:55432/lennette
      TEST_REDIS_URL: redis://127.0.0.1:56379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: api-linux
      - name: Format
        run: cargo fmt -p lennette-server -p lennette-protocol -p lennette-attachments -- --check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Deployment safety tests
        run: bun test scripts/deploy-api.test.ts
      - name: Lint
        run: cargo clippy --locked -p lennette-server -p lennette-protocol -p lennette-attachments --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked -p lennette-server -p lennette-protocol -p lennette-attachments --lib
      - name: PostgreSQL and Redis integration tests
        run: cargo test --locked -p lennette-server --test integration -- --ignored

  image:
    name: Build and publish API
    needs: checks
    # The Dokploy production host is ARM64; compile natively rather than emulate.
    runs-on: ubuntu-24.04-arm
    # Leave time to verify recovery as well as the image build and first rollout.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Image version
        id: version
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          bun -e '
            import { appendFileSync } from "node:fs";
            const { version } = Bun.TOML.parse(await Bun.file("apps/api/Cargo.toml").text()).package;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("API version must be major.minor.patch");
            const image = "ghcr.io/" + process.env.REPOSITORY.toLowerCase() + "-api";
            const sha = process.env.GITHUB_SHA;
            const channel = process.env.GITHUB_REF === "refs/heads/main" ? "main" : "bootstrap";
            const build = `${version}-${channel}.${process.env.GITHUB_RUN_NUMBER}.${sha.slice(0, 12)}`;
            appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}\nversion=${build}\nsha=${sha}\n`);
          '
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.deploy_production)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.deploy_production) }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.sha }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=Lennette API
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=lennette-api
          cache-to: type=gha,mode=max,scope=lennette-api
          provenance: mode=max
          sbom: true
      - name: Deploy published digest to Dokploy
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || inputs.deploy_production)
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          API_HEALTH_URL: https://lennapi.itssingularity.com/health/ready
          API_IMAGE: ${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}
          DEPLOYMENT_TITLE: API ${{ github.sha }} (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})
        run: bun scripts/deploy-api.ts
      - name: Publish build summary
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Lennette API\n\nImage: `%s:%s`\n\nDigest: `%s`\n\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
