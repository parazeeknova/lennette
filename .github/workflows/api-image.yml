name: API container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - apps/api/**
      - crates/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - infra/Dockerfile
      - .dockerignore
      - .github/workflows/api-image.yml
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication so an older main build cannot overwrite latest later.
concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  checks:
    name: API lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: lennette
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: lennette
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lennette -d lennette"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://lennette:local-development-only@127.0.0.1:55432/lennette
      TEST_REDIS_URL: redis://127.0.0.1:56379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: api-linux
      - name: Format
        run: cargo fmt -p lennette-server -p lennette-protocol -p lennette-attachments -- --check
      - name: Lint
        run: cargo clippy --locked -p lennette-server -p lennette-protocol -p lennette-attachments --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked -p lennette-server -p lennette-protocol -p lennette-attachments --lib
      - name: PostgreSQL and Redis integration tests
        run: cargo test --locked -p lennette-server --test integration -- --ignored

  image:
    name: Build and publish API
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image version
        id: version
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('apps/api/Cargo.toml').read_text())['package']['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('API package version must be major.minor.patch')
          image = 'ghcr.io/' + os.environ['REPOSITORY'].lower() + '-api'
          sha = os.environ['GITHUB_SHA']
          build = f"{version}-main.{os.environ['GITHUB_RUN_NUMBER']}.{sha[:12]}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'image={image}\nversion={build}\nsha={sha}\n')
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.sha }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=Lennette API
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=lennette-api
          cache-to: type=gha,mode=max,scope=lennette-api
          provenance: mode=max
          sbom: true
      - name: Publish build summary
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Lennette API\n\nImage: `%s:%s`\n\nDigest: `%s`\n\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
