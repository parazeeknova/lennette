name: Quality checks

on:
  pull_request:
    branches: [main]
  # Reuse the same checks before building a merged main commit.
  workflow_call:

permissions:
  contents: read

# Superseded PR commits do not need duplicate checks. Main releases retain their
# own checks; a reusable run never shares a concurrency group with its caller.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  macos-native:
    name: macOS native smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check native bridge and application metadata
        run: bash scripts/macos-smoke.sh

  checks:
    name: Format, lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Restore Rust check cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: quality-linux
          cache-on-failure: true
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Install Linux native dependencies
        uses: ./.github/actions/setup-linux
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust typecheck
        run: cargo check --locked --workspace --all-targets
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install website dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: TypeScript tooling tests
        run: bun --no-env-file test scripts/dev-env.test.ts scripts/deploy-api.test.ts scripts/openobserve.test.ts
      - name: Website format
        working-directory: apps/web
        run: bun run format:check
      - name: Website lint
        working-directory: apps/web
        run: bun run lint
      - name: Website typecheck
        working-directory: apps/web
        run: bun run typecheck
      - name: Website tests
        working-directory: apps/web
        run: bun run test
      - name: Website SSR and SEO checks
        working-directory: apps/web
        shell: bash
        run: |
          bun run dev --host 127.0.0.1 --port 18080 > "$RUNNER_TEMP/lennette-web-seo.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/; then break; fi
            sleep 1
          done
          bun run seo:check http://127.0.0.1:18080
