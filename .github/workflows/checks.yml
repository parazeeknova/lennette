name: Quality checks

on:
  pull_request:
    branches: [main]
  # Reuse the same checks before building a merged main commit.
  workflow_call:

permissions:
  contents: read

# Superseded PR commits do not need duplicate checks. Main releases retain their
# own checks; a reusable run never shares a concurrency group with its caller.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  checks:
    name: Format, lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Restore Rust check cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: quality-linux
          cache-on-failure: true
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Install Linux native dependencies
        uses: ./.github/actions/setup-linux
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust typecheck
        run: cargo check --locked --workspace --all-targets
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install website dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Website format
        working-directory: web
        run: bun run format:check
      - name: Website lint
        working-directory: web
        run: bun run lint
      - name: Website typecheck
        working-directory: web
        run: bun run typecheck
