[workspace]
members = ["apps/desktop", "apps/api", "tools", "crates/protocol", "crates/sync-client"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
sha2 = "0.11.1"
rand = "0.10.3"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = true

# Transitive build fix, see vendor/README.md.
[patch.crates-io]
redis-protocol = { path = "vendor/redis-protocol" }
xattr = { path = "vendor/xattr" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

