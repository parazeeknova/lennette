[workspace]
members = ["apps/desktop", "tools"]
default-members = ["apps/desktop"]
resolver = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = true

# Transitive build fix, see vendor/README.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

