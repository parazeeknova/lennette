[package]
name = "lennette"
description = "An ambient real-time meeting and discussion copilot"
version = "0.18.26"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Singularity Works"]
homepage = "https://itssingularity.com"

# Shared installed-app identity. Cargo's crate/binary name remains `lennette`.
[package.metadata.lennette]
identifier = "com.itssingularity.lennette"
name = "Lennette"
publisher = "Singularity Works"

[dependencies]
lennette-attachments = { path = "../../crates/attachments" }
calamine = { version = "0.38", default-features = false }
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "signal"] }
reqwest = { workspace = true, default-features = false, features = ["rustls-no-provider", "json", "stream"] }
futures-util = "0.3.34"
base64.workspace = true
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
parking_lot = "0.12.5"
directories = "6.0.0"
lucide-icons = "1.60.0"
pulldown-cmark = "0.13.4"
raw-window-handle = "0.6"
aes-gcm = "0.11.1"
rand.workspace = true
sha2.workspace = true
hound = "3.5.1"
cpal = "0.18.2"
xcap = "0.9.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rustls = { workspace = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls", "with-json", "with-uuid"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "tls-rustls-ring"] }
lennette-protocol = { path = "../../crates/protocol" }
lennette-sync-client = { path = "../../crates/sync-client" }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-onig"] }
pdf-extract = "0.12.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
x11rb = { version = "0.13.2", features = ["allow-unsafe-code"] }
ksni = { version = "0.3.7", features = ["blocking"] }
zbus = "5.19"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
libc = "0.2.191"

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[build-dependencies]
embed-resource = "3.0.12"
cc = "1"
toml_edit = "0.25"

[[test]]
name = "macos_text"
harness = false
