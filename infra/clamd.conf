# Dokploy private scanner service. Do not publish port 3310 on the host.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
FailIfCvdOlderThan 7
SelfCheck 600
MaxThreads 2
MaxQueue 8
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 64M
MaxRecursion 10
MaxFiles 256
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanXMLDOCS yes
AlertExceedsMax yes
AlertEncrypted yes
AlertOLE2Macros yes
AlertBrokenMedia yes
