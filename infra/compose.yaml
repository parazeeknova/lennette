name: lennette
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lennette
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: lennette
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lennette -d lennette"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-development-only}"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-development-only}
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file: ../apps/api/.env
    environment:
      API_BIND: 0.0.0.0:8090
      DATABASE_URL: postgres://lennette:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/lennette
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-development-only}@redis:6379/0
      ATTACHMENT_DIR: /data/attachments
    ports: ["127.0.0.1:8090:8090"]
    volumes: ["attachments:/data/attachments"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  postgres-data:
  redis-data:
  attachments:
