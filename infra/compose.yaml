name: lennette
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lennette
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: lennette
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lennette -d lennette"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-development-only}"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-development-only}
  clamav:
    image: clamav/clamav:stable@sha256:6d87c712e3391e13c1ba6e05dfb074d4b1ddb5a6834b23bb9da990d2a4ef042a
    ports: ["127.0.0.1:53310:3310"]
    volumes:
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-data:/var/lib/clamav
    environment:
      CLAMD_STARTUP_TIMEOUT: 300
    healthcheck:
      test: ["CMD-SHELL", "printf 'zPING\\0' | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  openobserve:
    image: o2cr.ai/openobserve/openobserve-enterprise:latest@sha256:b291aff44100931e68dd0469125b72c57e020d75099696e8b663549140bafc46
    ports: ["127.0.0.1:5080:5080"]
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER_EMAIL:-dev@lennette.local}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_USER_PASSWORD:-LocalOnly-Observe123!}
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
    volumes: ["openobserve-data:/data"]
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
  redis-data:
  clamav-data:
  openobserve-data:
